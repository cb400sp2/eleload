name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-phar:
    name: Build PHAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, phar
          tools: composer:v2
          coverage: none
          ini-values: phar.readonly=0

      - name: Install dependencies (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader --no-scripts

      - name: Build PHAR
        run: php -d phar.readonly=0 bin/build-phar.php

      - name: Smoke test PHAR
        run: php build/eleload.phar version

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/eleload.phar
          generate_release_notes: true
